[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo-hgt"
version = "0.1.0"
description = "Heterogeneous Graph Transformer for USP microclimate forecasting (ERA5 + IAG + INMET)."
requires-python = ">=3.10"
authors = [
  { name = "André Moreno" },
  { name = "Giovani Sebastianutti" },
  { name = "Matheus Guidoni" },
]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "xarray>=2024.6",
  "netCDF4>=1.6",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
meteo-train = "meteo_hgt.cli:train_main"
meteo-eval = "meteo_hgt.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
